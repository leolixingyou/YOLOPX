# YOLOP v3 Configuration (Remote Sensing Optimized)

MODEL:
  NAME: 'yolop_v3'
  BACKBONE: 'ELANNet'  # YOLOv7-style backbone
  NECK: 'PaFPNELAN'
  HEAD_TYPE: 'anchor_based'
  
  # Anchor configuration (4 scales for remote sensing)
  ANCHORS:
    - [4.15629, 11.41984, 5.94761, 16.46950, 8.18673, 23.52688]
    - [12.04416, 29.51737, 16.35089, 41.95507, 24.17928, 57.18741]
    - [33.29597, 78.16243, 47.86408, 108.28889, 36.33312, 189.21414]
    - [73.09806, 144.64581, 101.18080, 253.37000, 136.02821, 408.82248]
  
  # Special features
  FEATURES:
    USE_SIMAM: true      # SimAM attention mechanism
    USE_GHOST: true      # GhostConv for efficiency
    USE_REPCONV: true    # RepConv blocks
    
# Remote sensing specific settings
DATASET:
  IMAGE_SIZE: [1280, 1280]  # Larger images for remote sensing
  
TRAIN:
  BATCH_SIZE: 8  # Smaller batch due to larger images