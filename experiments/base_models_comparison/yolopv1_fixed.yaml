# Fixed YOLOPv1 Configuration
# 修正了层连接问题

model_family: yolop_v1_official

prediction_heads:
  det_out_idx: 24
  da_seg_out_idx: 33
  ll_seg_out_idx: 42

layers:
  # Backbone (CSP-Darknet) + Neck (FPN/PAN)
  - [-1, "Focus", [3, 32, 3]]           # 0 - 输入3通道，输出32通道
  - [0, "Conv", [32, 64, 3, 2]]         # 1 - 从0层获取输入（修正：原来是-1）
  - [1, "BottleneckCSP", [64, 64, 1]]   # 2 - 从1层获取输入（修正：原来是-1）
  - [2, "Conv", [64, 128, 3, 2]]        # 3 - 从2层获取输入（修正：原来是-1）
  - [3, "BottleneckCSP", [128, 128, 3]] # 4
  - [4, "Conv", [128, 256, 3, 2]]       # 5
  - [5, "BottleneckCSP", [256, 256, 3]] # 6
  - [6, "Conv", [256, 512, 3, 2]]       # 7
  - [7, "SPP", [512, 512, [5, 9, 13]]]  # 8
  - [8, "BottleneckCSP", [512, 512, 1, False]] # 9
  - [9, "Conv", [512, 256, 1, 1]]       # 10
  - [10, "Upsample", [null, 2, 'nearest']] # 11
  - [[11, 6], "Concat", [1]]            # 12
  - [12, "BottleneckCSP", [512, 256, 1, False]] # 13
  - [13, "Conv", [256, 128, 1, 1]]      # 14
  - [14, "Upsample", [null, 2, 'nearest']] # 15
  - [[15, 4], "Concat", [1]]            # 16

  # PAN Path (Bottom-up)
  - [16, "BottleneckCSP", [256, 128, 1, False]] # 17
  - [17, "Conv", [128, 128, 3, 2]]      # 18
  - [[18, 14], "Concat", [1]]           # 19
  - [19, "BottleneckCSP", [256, 256, 1, False]] # 20
  - [20, "Conv", [256, 256, 3, 2]]      # 21
  - [[21, 10], "Concat", [1]]           # 22
  - [22, "BottleneckCSP", [512, 512, 1, False]] # 23

  # Detection Head
  - [[17, 20, 23], "Detect", [1, [[3,9,5,11,4,20], [7,18,6,39,12,31], [19,50,38,81,68,157]], [128, 256, 512]]] # 24

  # Drivable Area Segmentation Head
  - [16, "Conv", [256, 128, 3, 1]]      # 25
  - [25, "Upsample", [null, 2, 'nearest']] # 26
  - [26, "BottleneckCSP", [128, 64, 1, False]] # 27
  - [27, "Conv", [64, 32, 3, 1]]        # 28
  - [28, "Upsample", [null, 2, 'nearest']] # 29
  - [29, "Conv", [32, 16, 3, 1]]        # 30
  - [30, "BottleneckCSP", [16, 8, 1, False]] # 31
  - [31, "Upsample", [null, 2, 'nearest']] # 32
  - [32, "Conv", [8, 2, 3, 1]]          # 33

  # Lane Line Segmentation Head
  - [16, "Conv", [256, 128, 3, 1]]      # 34
  - [34, "Upsample", [null, 2, 'nearest']] # 35
  - [35, "BottleneckCSP", [128, 64, 1, False]] # 36
  - [36, "Conv", [64, 32, 3, 1]]        # 37
  - [37, "Upsample", [null, 2, 'nearest']] # 38
  - [38, "Conv", [32, 16, 3, 1]]        # 39
  - [39, "BottleneckCSP", [16, 8, 1, False]] # 40
  - [40, "Upsample", [null, 2, 'nearest']] # 41
  - [41, "Conv", [8, 2, 3, 1]]          # 42