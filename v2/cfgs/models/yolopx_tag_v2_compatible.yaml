# YOLOP-TAG网络架构配置文件 (v2兼容版)
# 根据v2的实际FPN输出调整通道数配置

# 预测头索引配置
prediction_heads:
  det_out_idx: 2      # 检测输出索引（与原始一致）
  da_seg_out_idx: 18  # 驾驶区域分割输出索引
  ll_seg_out_idx: 34  # 车道线分割输出索引

# 网络架构定义
# 格式: [输入来源, 模块类型, 参数列表]
layers:
  # Backbone - ELANNet骨干网络
  - [-1, "ELANNet", [true]]  # 0

  # PaFPNELAN - 特征金字塔网络
  - [-1, "PaFPNELAN", []]    # 1

  # Detection Head - YOLOX检测头（保持原始结构）
  - [-1, "YOLOXHead", [1]]   # 2

  # 渐进式上采样分支
  - [1, "FPN_C3", []]        # 3 - 256通道 (c16)
  - [1, "FPN_C4", []]        # 4 - 512通道 (c8)

  # 第一个分割头分支 (驾驶区域分割) - 添加TAG注意力
  - [4, "TaskAttention", [512, 3]]               # 5. TAG注意力机制 (输入512通道)
  - [-1, "Select", [1]]                          # 6. 选择DA任务特征
  - [-1, "Conv", [512, 256, 3, 1]]               # 7
  - [-1, "Upsample", [null, 2, "bilinear"]]     # 8
  - [-1, "ELANBlock_Head", [256, 128]]          # 9
  - [-1, "Conv", [128, 64, 3, 1]]               # 10
  - [-1, "Upsample", [null, 2, "bilinear"]]     # 11
  - [-1, "Conv", [64, 32, 3, 1]]                # 12
  - [-1, "Upsample", [null, 2, "bilinear"]]     # 13
  - [-1, "Conv", [32, 16, 3, 1]]                # 14
  - [-1, "ELANBlock_Head", [16, 8]]             # 15
  - [-1, "Upsample", [null, 2, "bilinear"]]     # 16
  - [-1, "Conv", [8, 2, 3, 1]]                  # 17
  - [-1, "seg_head", ["sigmoid"]]               # 18 - 驾驶区域分割头

  # 第二个分割头分支 (车道线分割) - 添加TAG注意力和特征融合
  - [1, "FPN_C2", []]                           # 19 - 256通道 (C2)
  - [-1, "Conv", [256, 128, 3, 1]]              # 20
  
  # 融合TAG特征和原始特征
  - [5, "Select", [2]]                          # 21. 选择LL任务特征
  - [3, "Conv", [256, 128, 3, 1]]               # 22. 处理FPN_C3输出(256通道)
  - [-1, "Upsample", [null, 2, "bilinear"]]     # 23
  - [[-1, 20], "MergeBlock", ["add"]]           # 24 - TAG特征和C2特征相加
  
  # 车道线分割头后续层
  - [-1, "ELANBlock_Head", [128, 64]]           # 25
  - [-1, "PSA_p", [64, 64]]                     # 26
  - [-1, "Conv", [64, 32, 3, 1]]                # 27
  - [-1, "Upsample", [null, 2, "bilinear"]]     # 28
  - [-1, "Conv", [32, 16, 3, 1]]                # 29
  - [-1, "ELANBlock_Head", [16, 8]]             # 30
  - [-1, "PSA_p", [8, 8]]                       # 31
  - [-1, "Upsample", [null, 2, "bilinear"]]     # 32
  - [-1, "Conv", [8, 2, 3, 1]]                  # 33
  - [-1, "seg_head", ["sigmoid"]]               # 34 - 车道线分割头

# 模型配置参数
model_config:
  nc: 1  # 类别数量
  input_size: [3, 256, 256]  # 输入尺寸 [通道数, 高度, 宽度]