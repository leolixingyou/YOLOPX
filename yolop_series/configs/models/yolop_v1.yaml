# YOLOP v1 specific configuration
# Inherits from default.yaml

MODEL:
  TYPE: 'yolop_v1'
  BACKBONE: 'CSPDarknet'
  NECK: 'SPP+FPN+PAN'
  HEAD: 'anchor_based'
  ANCHORS: 
    - [3,9, 5,11, 4,20]
    - [7,18, 6,39, 12,31]
    - [19,50, 38,81, 68,157]
  ANCHOR_THRESHOLD: 4.0
  
LOSS:
  FL_GAMMA: 0.0  # v1 doesn't use focal loss