# BDD100k Multi-class Dataset Configuration
# 支持BDD100K的全部10个检测类别

DATASET:
  DATAROOT: '/workspace/YOLOPX/v1/bdd100k/images'
  LABELROOT: '/workspace/bdd100k/yolop_train/bdd_det/'
  MASKROOT: '/workspace/bdd100k/yolop_train/bdd_seg_gt/'
  LANEROOT: '/workspace/bdd100k/yolop_train/bdd_lane_gt/'
  DATASET: BddDataset
  TRAIN_SET: train
  TEST_SET: val
  DATA_FORMAT: jpg
  SELECT_DATA: false
  ORG_IMG_SIZE: [720, 1280]
  IMAGE_SIZE: [384, 640] # h, w
  NUM_SEG_CLASS: 2  # 分割任务仍然是2类（背景+可行驶区域）
  NUMBER_IMAGE: -1  # 使用全部图片
  NC: 10  # 10个检测类别
  NAMES: ['person', 'rider', 'car', 'bus', 'truck', 
          'bike', 'motor', 'traffic light', 'traffic sign', 'train']
  SINGLE_CLS: false  # 多类模式

AUGMENTATION:
  FLIP: true
  SCALE_FACTOR: 0.25
  ROT_FACTOR: 10
  TRANSLATE: 0.1
  SHEAR: 0.0
  COLOR_RGB: false
  HSV_H: 0.015
  HSV_S: 0.7
  HSV_V: 0.4
  MOSAIC_RATE: 0.0
  MIXUP_RATE: 0.15