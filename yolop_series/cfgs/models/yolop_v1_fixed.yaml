# YOLOPv1 Fixed Configuration
# 修复了层连接问题

model_family: yolop_v1_official

# Prediction head indices
prediction_heads:
  det_out_idx: 24
  da_seg_out_idx: 33
  ll_seg_out_idx: 42

# Network layers definition
# Format: [from, module_name, args]
layers:
  # Backbone (CSP-Darknet) + Neck (FPN/PAN)
  - [-1, "Focus", [3, 32, 3]]           # 0 - 从输入(3通道)
  - [0, "Conv", [32, 64, 3, 2]]         # 1 - 从0层(32通道) [修复：原来是-1]
  - [1, "BottleneckCSP", [64, 64, 1]]   # 2 - 从1层(64通道) [修复：原来是-1]
  - [2, "Conv", [64, 128, 3, 2]]        # 3 - 从2层(64通道) [修复：原来是-1]
  - [3, "BottleneckCSP", [128, 128, 3]] # 4 - 从3层(128通道) [修复：原来是-1]
  - [4, "Conv", [128, 256, 3, 2]]       # 5 - 从4层(128通道) [修复：原来是-1]
  - [5, "BottleneckCSP", [256, 256, 3]] # 6 - 从5层(256通道) [修复：原来是-1]
  - [6, "Conv", [256, 512, 3, 2]]       # 7 - 从6层(256通道) [修复：原来是-1]
  - [7, "SPP", [512, 512, [5, 9, 13]]]  # 8 - 从7层(512通道) [修复：原来是-1]
  - [8, "BottleneckCSP", [512, 512, 1, False]] # 9 - 从8层(512通道) [修复：原来是-1]
  - [9, "Conv", [512, 256, 1, 1]]       # 10 - 从9层(512通道) [修复：原来是-1]
  - [10, "Upsample", [null, 2, 'nearest']] # 11 - 从10层 [修复：原来是-1]
  - [[11, 6], "Concat", [1]]            # 12 - 连接11和6层
  - [12, "BottleneckCSP", [512, 256, 1, False]] # 13 - 从12层 [修复：原来是-1]
  - [13, "Conv", [256, 128, 1, 1]]      # 14 - 从13层 [修复：原来是-1]
  - [14, "Upsample", [null, 2, 'nearest']] # 15 - 从14层 [修复：原来是-1]
  - [[15, 4], "Concat", [1]]            # 16 - 连接15和4层
  - [16, "BottleneckCSP", [256, 128, 1, False]] # 17 - 从16层 [修复：原来是-1]
  - [17, "Conv", [128, 128, 3, 2]]      # 18 - 从17层 [修复：原来是-1]
  - [[18, 14], "Concat", [1]]           # 19 - 连接18和14层
  - [19, "BottleneckCSP", [256, 256, 1, False]] # 20 - 从19层 [修复：原来是-1]
  - [20, "Conv", [256, 256, 3, 2]]      # 21 - 从20层 [修复：原来是-1]
  - [[21, 10], "Concat", [1]]           # 22 - 连接21和10层
  - [22, "BottleneckCSP", [512, 512, 1, False]] # 23 - 从22层 [修复：原来是-1]
  
  # Detection Head
  - [[17, 20, 23], "Detect", [1, [[3,9,5,11,4,20], [7,18,6,39,12,31], [19,50,38,81,68,157]], [128, 256, 512]]] # 24
  
  # Drivable Area Segmentation Head
  - [17, "Conv", [128, 64, 3, 1]]       # 25 - 从17层 [修复：原来是-1]
  - [25, "Upsample", [null, 2, 'nearest']] # 26 - 从25层 [修复：原来是-1]
  - [26, "BottleneckCSP", [64, 64, 1, False]] # 27 - 从26层 [修复：原来是-1]
  - [27, "Conv", [64, 32, 3, 1]]        # 28 - 从27层 [修复：原来是-1]
  - [28, "Upsample", [null, 2, 'nearest']] # 29 - 从28层 [修复：原来是-1]
  - [29, "Conv", [32, 16, 3, 1]]        # 30 - 从29层 [修复：原来是-1]
  - [30, "BottleneckCSP", [16, 8, 1, False]] # 31 - 从30层 [修复：原来是-1]
  - [31, "Upsample", [null, 2, 'nearest']] # 32 - 从31层 [修复：原来是-1]
  - [32, "Conv", [8, 2, 3, 1]]          # 33 - 从32层(驾驶区域输出) [修复：原来是-1]
  
  # Lane Line Segmentation Head  
  - [17, "Conv", [128, 64, 3, 1]]       # 34 - 从17层 [修复：原来是-1]
  - [34, "Upsample", [null, 2, 'nearest']] # 35 - 从34层 [修复：原来是-1]
  - [35, "BottleneckCSP", [64, 64, 1, False]] # 36 - 从35层 [修复：原来是-1]
  - [36, "Conv", [64, 32, 3, 1]]        # 37 - 从36层 [修复：原来是-1]
  - [37, "Upsample", [null, 2, 'nearest']] # 38 - 从37层 [修复：原来是-1]
  - [38, "Conv", [32, 16, 3, 1]]        # 39 - 从38层 [修复：原来是-1]
  - [39, "BottleneckCSP", [16, 8, 1, False]] # 40 - 从39层 [修复：原来是-1]
  - [40, "Upsample", [null, 2, 'nearest']] # 41 - 从40层 [修复：原来是-1]
  - [41, "Conv", [8, 2, 3, 1]]          # 42 - 从41层(车道线输出) [修复：原来是-1]