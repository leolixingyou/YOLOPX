# YOLOPX-TAG 基于论文原理的实现
# Multi-task Learning for Real-time Autonomous Driving Leveraging Task-adaptive Attention Generator

# 预测头索引配置
prediction_heads:
  det_out_idx: 2      # 检测输出索引
  da_seg_out_idx: 18  # 驾驶区域分割输出索引
  ll_seg_out_idx: 33  # 车道线分割输出索引

# 网络架构定义 - 基于论文的TAG架构
layers:
  # Backbone - ELANNet骨干网络
  - [-1, "ELANNet", [true]]  # 0 - 输出多尺度特征

  # PaFPNELAN - 特征金字塔网络
  - [-1, "PaFPNELAN", []]    # 1 - 返回[C2, c5, c8, c12, c13, c16, c19]

  # Detection Head - YOLOX检测头
  - [-1, "YOLOXHead", [1]]   # 2

  # 获取语义分支和细节分支特征 (TAG专用)
  - [1, "FPN_C4_TAG", []]    # 3 - 语义特征 (c8, 512通道, 低分辨率)
  - [1, "FPN_C2", []]        # 4 - 细节特征 (C2, 256通道, 高分辨率)

  # TAG模块 - 核心任务自适应注意力生成器  
  - [[-1, 3], "TaskAdaptiveAttentionGenerator", [512, 256, 256, 3]]  # 5 - TAG模块 (语义512, 细节256)

  # 第一个分割头分支 (驾驶区域分割)
  - [5, "TAGSelect", [1]]                        # 6 - 选择DA任务特征 (task_id=1)
  - [-1, "Conv", [256, 128, 3, 1]]               # 7
  - [-1, "Upsample", [null, 2, "bilinear"]]     # 8
  - [-1, "ELANBlock_Head", [128, 64]]           # 9
  - [-1, "Conv", [64, 32, 3, 1]]                # 10
  - [-1, "Upsample", [null, 2, "bilinear"]]     # 11
  - [-1, "Conv", [32, 16, 3, 1]]                # 12
  - [-1, "Upsample", [null, 2, "bilinear"]]     # 13
  - [-1, "Conv", [16, 8, 3, 1]]                 # 14
  - [-1, "ELANBlock_Head", [8, 4]]              # 15
  - [-1, "Upsample", [null, 2, "bilinear"]]     # 16
  - [-1, "Conv", [4, 2, 3, 1]]                  # 17
  - [-1, "seg_head", ["sigmoid"]]               # 18 - DA分割头

  # 获取常规FPN特征用于融合 (TAG专用)
  - [1, "FPN_C3_TAG", []]                       # 19 - 256通道特征

  # 第二个分割头分支 (车道线分割) 
  - [5, "TAGSelect", [2]]                       # 20 - 选择LL任务特征 (task_id=2)
  - [[-1, 19], "TAGFusionLayer", [256, 256, 128]]  # 21 - 融合TAG特征和FPN特征
  - [-1, "ELANBlock_Head", [128, 64]]           # 22
  - [-1, "PSA_p", [64, 64]]                     # 23
  - [-1, "Conv", [64, 32, 3, 1]]                # 24
  - [-1, "Upsample", [null, 2, "bilinear"]]     # 25
  - [-1, "Conv", [32, 16, 3, 1]]                # 26
  - [-1, "ELANBlock_Head", [16, 8]]             # 27
  - [-1, "PSA_p", [8, 8]]                       # 28
  - [-1, "Upsample", [null, 2, "bilinear"]]     # 29
  - [-1, "Conv", [8, 4, 3, 1]]                  # 30
  - [-1, "Upsample", [null, 2, "bilinear"]]     # 31
  - [-1, "Conv", [4, 2, 3, 1]]                  # 32
  - [-1, "seg_head", ["sigmoid"]]               # 33 - LL分割头

# 模型配置参数
model_config:
  nc: 1  # 类别数量
  input_size: [3, 256, 256]  # 输入尺寸 [通道数, 高度, 宽度]
  
# TAG特定配置
tag_config:
  num_tasks: 3                    # 任务数量
  semantic_channels: 512          # 语义分支通道数
  detail_channels: 256            # 细节分支通道数
  output_channels: 256            # TAG输出通道数