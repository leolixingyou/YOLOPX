# YOLOPv3 Official Architecture Configuration (Faithful Replication)
# Reference: /workspace/YOLOP_v3_official/lib/models/YOLOP.py

model_family: yolop_v3_official

# Prediction head indices
prediction_heads:
  det_out_idx: 3
  da_seg_out_idx: 17
  ll_seg_out_idx: 27

# Network layers definition
# Format: [from, module_name, args]
layers:
  # Backbone
  - [-1, "ELANNet", [True]]   # 0

  # Neck
  - [-1, "PaFPNELAN_Ghost_C2", []]   # 1
  - [1, "Repconv_Block", []]   # 2

  # Detection Head
  - [-1, "IDetect",  [1, [[4.15629,  11.41984,  5.94761,  16.46950,  8.18673,  23.52688], [12.04416,  29.51737, 16.35089,  41.95507, 24.17928,  57.18741], [33.29597,  78.16243, 47.86408, 108.28889, 36.33312, 189.21414], [73.09806, 144.64581, 101.18080, 253.37000, 136.02821, 408.82248]], [128, 256, 512, 1024]]] # 3

  # Feature selectors for segmentation heads
  - [1, "FPN_C2", []]   # 4
  - [1, "FPN_C5", []]   # 5

  # Drivable Area Segmentation Head
  - [5, "Conv", [512, 256, 3, 1]]  
  - [-1, "Upsample", [null, 2, 'bilinear', True]]  
  - [-1, "ELANBlock_Head", [256, 128]]
  - [-1, "Conv", [128, 64, 3, 1]] 
  - [-1, "Upsample", [null, 2, 'bilinear', True]] 
  - [-1, "Conv", [64, 32, 3, 1]] 
  - [-1, "Upsample", [null, 2, 'bilinear', True]] 
  - [-1, "Conv", [32, 16, 3, 1]] 
  - [-1, "ELANBlock_Head", [16, 8]] 
  - [-1, "Upsample", [null, 2, 'bilinear', True]] 
  - [-1, "Conv", [8, 2, 3, 1]] 
  - [-1, "seg_head", ['sigmoid']]  # 17

  # Lane Line Segmentation Head
  - [4, "ELANBlock_Head", [128, 64]] 
  - [-1, "PSA_p", [64, 64]]  
  - [-1, "Conv", [64, 32, 3, 1]] 
  - [-1, "Upsample", [null, 2, 'bilinear', True]] 
  - [-1, "Conv", [32, 16, 3, 1]] 
  - [-1, "ELANBlock_Head", [16, 8]]
  - [-1, "PSA_p", [8, 8]]   
  - [-1, "Upsample", [null, 2, 'bilinear', True]] 
  - [-1, "Conv", [8, 2, 3, 1]] 
  - [-1, "seg_head", ['sigmoid']]  # 27
