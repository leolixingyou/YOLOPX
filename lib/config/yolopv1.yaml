# 模型通用配置
model_config:
  nc: 1 # Number of classes for detection (根据BDD100K，通常车辆是1类)

# 预测头输出索引
prediction_heads:
  det_out_idx: 24 # Detection head output index
  da_seg_out_idx: 33 # Drivable area segmentation output index
  ll_seg_out_idx: 42 # Lane line segmentation output index

# 网络层定义 (根据 YOLOP.py 中的 YOLOP 列表)
layers:
  # Backbone and Neck (Encoder)
  - [-1, Focus, [3, 32, 3]] # 0
  - [-1, Conv, [32, 64, 3, 2]] # 1
  - [-1, BottleneckCSP, [64, 64, 1]] # 2
  - [-1, Conv, [64, 128, 3, 2]] # 3
  - [-1, BottleneckCSP, [128, 128, 3]] # 4
  - [-1, Conv, [128, 256, 3, 2]] # 5
  - [-1, BottleneckCSP, [256, 256, 3]] # 6
  - [-1, Conv, [256, 512, 3, 2]] # 7
  - [-1, SPP, [512, 512, [5, 9, 13]]] # 8
  - [-1, BottleneckCSP, [512, 512, 1, false]] # 9
  - [-1, Conv, [512, 256, 1, 1]] # 10
  - [-1, Upsample, [null, 2, 'nearest']] # 11
  - [ [-1, 6], Concat, [1]] # 12
  - [-1, BottleneckCSP, [512, 256, 1, false]] # 13
  - [-1, Conv, [256, 128, 1, 1]] # 14
  - [-1, Upsample, [null, 2, 'nearest']] # 15
  - [ [-1,4], Concat, [1]] # 16 (End of Encoder)

  # Detection head
  - [-1, BottleneckCSP, [256, 128, 1, false]] # 17
  - [-1, Conv, [128, 128, 3, 2]] # 18
  - [ [-1, 14], Concat, [1]] # 19
  - [-1, BottleneckCSP, [256, 256, 1, false]] # 20
  - [-1, Conv, [256, 256, 3, 2]] # 21
  - [ [-1, 10], Concat, [1]] # 22
  - [-1, BottleneckCSP, [512, 512, 1, false]] # 23
  - [ [17, 20, 23], Detect, [1, [[3,9,5,11,4,20], [7,18,6,39,12,31], [19,50,38,81,68,157]], [128, 256, 512]]] # 24 (Detection head output)

  # Drivable area segmentation head
  - [16, Conv, [256, 128, 3, 1]] # 25
  - [-1, Upsample, [null, 2, 'nearest']] # 26
  - [-1, BottleneckCSP, [128, 64, 1, false]] # 27
  - [-1, Conv, [64, 32, 3, 1]] # 28
  - [-1, Upsample, [null, 2, 'nearest']] # 29
  - [-1, Conv, [32, 16, 3, 1]] # 30
  - [-1, BottleneckCSP, [16, 8, 1, false]] # 31
  - [-1, Upsample, [null, 2, 'nearest']] # 32
  - [-1, Conv, [8, 2, 3, 1]] # 33 (Driving area segmentation head output)

  # Lane line segmentation head
  - [16, Conv, [256, 128, 3, 1]] # 34
  - [-1, Upsample, [null, 2, 'nearest']] # 35
  - [-1, BottleneckCSP, [128, 64, 1, false]] # 36
  - [-1, Conv, [64, 32, 3, 1]] # 37
  - [-1, Upsample, [null, 2, 'nearest']] # 38
  - [-1, Conv, [32, 16, 3, 1]] # 39
  - [-1, BottleneckCSP, [16, 8, 1, false]] # 40
  - [-1, Upsample, [null, 2, 'nearest']] # 41
  - [-1, Conv, [8, 2, 3, 1]] # 42 (Lane line segmentation head output)