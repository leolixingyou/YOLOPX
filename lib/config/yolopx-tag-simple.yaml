# YOLOP-TAG网络架构配置文件 (简化测试版本)
# 只包含检测头，用于调试

# 预测头索引配置
prediction_heads:
  det_out_idx: 4      # 检测输出索引
  da_seg_out_idx: 7   # 驾驶区域分割输出索引 (测试用)
  ll_seg_out_idx: 8   # 车道线分割输出索引 (测试用)

# 网络架构定义
layers:
  # 1. Backbone - ELANNet骨干网络
  - [-1, "ELANNet", [True]]  # 0

  # 2. Neck - PaFPNELAN 特征金字塔
  - [0, "PaFPNELAN", []]    # 1

  # 3. MultiScale TAG - Task-adaptive Attention Generator for all scales
  - [1, "MultiScaleTaskAttention", [[256, 512, 512, 256, 128, 256, 512], 3]] # 2

  # --- Branch 1: Detection Head ---
  - [2, "Select", [0]]      # 3. 选择检测任务的多尺度特征
  - [-1, "YOLOXHead", [1]]  # 4. 检测头

  # 临时分割头(占位符)
  - [2, "Select", [1]]      # 5. 选择第1个任务
  - [-1, "Select", [4]]     # 6. 选择128通道特征
  - [-1, "Conv", [128, 2, 3, 1]]  # 7. 临时DA seg头
  - [-1, "Conv", [2, 2, 3, 1]]    # 8. 临时LL seg头

model_config:
  nc: 1